<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manual de Usuario · OptiBottle</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Archivo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --azul: #0f1e3d;
    --amarillo: #fbbf24;
    --crema: #f5f1e8;
    --negro: #0a0e1a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Archivo', sans-serif;
    background: var(--crema);
    color: var(--negro);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  nav {
    background: var(--azul);
    color: var(--crema);
    padding: 16px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  nav .logo {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 18px;
  }
  nav .logo span { color: var(--amarillo); }
  nav a {
    color: var(--crema);
    text-decoration: none;
    font-size: 14px;
    padding: 8px 16px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 6px;
    transition: all 0.2s;
  }
  nav a:hover {
    background: var(--amarillo);
    color: var(--azul);
    border-color: var(--amarillo);
  }
  .header {
    background: var(--azul);
    color: var(--crema);
    padding: 30px 40px 40px;
    text-align: center;
  }
  .header .tag {
    font-family: 'Space Mono', monospace;
    color: var(--amarillo);
    font-size: 13px;
    letter-spacing: 2px;
    margin-bottom: 12px;
  }
  .header h1 {
    font-size: 42px;
    font-weight: 900;
    letter-spacing: -1.5px;
  }
  .header p {
    color: rgba(245,241,232,0.7);
    margin-top: 8px;
  }
  .actions {
    text-align: center;
    margin: 30px 0;
  }
  .actions a {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    background: var(--azul);
    color: var(--amarillo);
    text-decoration: none;
    border-radius: 6px;
    font-weight: 700;
    font-size: 14px;
    margin: 0 6px;
    transition: all 0.2s;
  }
  .actions a:hover {
    background: var(--negro);
    transform: translateY(-2px);
  }
  .pdf-container {
    flex: 1;
    padding: 0 40px 40px;
    max-width: 1400px;
    margin: 0 auto;
    width: 100%;
  }
  .pdf-container embed,
  .pdf-container iframe {
    width: 100%;
    height: 85vh;
    border: 2px solid var(--azul);
    border-radius: 8px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.1);
  }
  .pdf-fallback {
    background: white;
    border: 2px solid var(--azul);
    border-radius: 8px;
    padding: 60px 40px;
    text-align: center;
  }
  .pdf-fallback p {
    margin-bottom: 20px;
    color: #475569;
  }
  footer {
    background: var(--negro);
    color: rgba(245,241,232,0.5);
    text-align: center;
    padding: 20px;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
  }
  @media (max-width: 768px) {
    nav { padding: 14px 20px; }
    .header { padding: 20px; }
    .header h1 { font-size: 28px; }
    .pdf-container { padding: 0 20px 20px; }
    .pdf-container embed, .pdf-container iframe { height: 70vh; }
  }
</style>
</head>
<body>

<nav>
  <div class="logo">Opti<span>Bottle</span></div>
  <a href="index.html">← Volver al inicio</a>
</nav>

<div class="header">
  <div class="tag">// DOCUMENTACIÓN</div>
  <h1>Manual de Usuario</h1>
  <p>Guía paso a paso para operadores y supervisores</p>
</div>

<div class="actions">
  <a href="manuales/optibottle_Manual_Usuario.pdf" download>↓ Descargar PDF</a>
  <a href="manuales/optibottle_Manual_Usuario.pdf" target="_blank">↗ Abrir en pestaña nueva</a>
</div>

<div class="pdf-container">
  <embed src="manuales/optibottle_Manual_Usuario.pdf" type="application/pdf">
</div>

<footer>EQUIPO 2 · SISTEMAS DE INFORMACIÓN · PIA 2026</footer>

</body>
</html>
